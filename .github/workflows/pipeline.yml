name: Ansible Deploy

on: 
  workflow_dispatch: {}
  push:
   branches: ["main"]

jobs:
  run-ansible:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: listout
        run: |
          pwd
          ls -ltr
          ansible --version

      - name: Run Playbook
        run: |
          ansible-playbook -i inventories/dev.yml playbook.yml
